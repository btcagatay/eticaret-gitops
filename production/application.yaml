
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eticaret-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/btcagatay/eticaret-gitops.git
    targetRevision: main
    path: production
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: false
      selfHeal: true

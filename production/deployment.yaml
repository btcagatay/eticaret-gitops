apiVersion: apps/v1
kind: Deployment
metadata:
  name: eticaret-api
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eticaret-api
  template:
    metadata:
      labels:
        app: eticaret-api
    spec:
      containers:
        - name: eticaret-api
          image: cemilturkmus/eticaret-api:1.0   
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
